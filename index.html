<!DOCTYPE html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cursos del Professorat</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 0;
        background: #f8f9fa;
        color: #333;
        transition: background 0.3s, color 0.3s;
      }
      header {
        background: #2c3e50;
        color: white;
        text-align: center;
        padding: 2rem 1rem;
      }
      header h1 {
        margin: 0;
        font-size: 2rem;
      }
      main {
        max-width: 800px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      .course-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 1rem;
      }
      .course-list li a {
        display: block;
        padding: 1rem;
        background: white;
        border: 1px solid #ddd;
        border-radius: 8px;
        text-decoration: none;
        color: #2c3e50;
        font-weight: 500;
        transition: background 0.2s, transform 0.2s, color 0.2s;
      }
      .course-list li a:hover {
        background: #ecf0f1;
        transform: translateY(-2px);
      }
      footer {
        text-align: center;
        margin: 3rem 0 1rem;
        font-size: 0.9rem;
        color: #777;
      }

      /* --- MODE FOSC --- */
      body.dark {
        background: #1c1c1c;
        color: #eee;
      }
      body.dark header {
        background: #111;
      }
      body.dark .course-list li a {
        background: #2a2a2a;
        border: 1px solid #444;
        color: #eee;
      }
      body.dark .course-list li a:hover {
        background: #3a3a3a;
      }
      body.dark footer {
        color: #aaa;
      }

      /* Botó mode */
      .toggle-btn {
        position: absolute;
        top: 1rem;
        right: 1rem;
        padding: 0.5rem 1rem;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        background: #f1f1f1;
        font-weight: 500;
        transition: background 0.2s;
      }
      .toggle-btn:hover {
        background: #ddd;
      }
      body.dark .toggle-btn {
        background: #333;
        color: #eee;
      }
      body.dark .toggle-btn:hover {
        background: #444;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Docència</h1>
      <button class="toggle-btn" onclick="toggleDarkMode()">
        🌙 Mode Fosc
      </button>
    </header>

    <main>
      <ul class="course-list">
        <li>
          <a href="/mates">Matemàtiques aplicades a les ciències socials II</a>
        </li>
        <li><a href="/programacio">Programació</a></li>
        <li><a href="/aulapoints">Evaluació en viu</a></li>
        <!-- Afegeix més cursos aquí -->
      </ul>
    </main>

    <footer>&copy; 2025 · Carlos García Rodríguez</footer>

    <script>
      function toggleDarkMode() {
        document.body.classList.toggle("dark");
        const btn = document.querySelector(".toggle-btn");
        if (document.body.classList.contains("dark")) {
          btn.textContent = "☀️ Mode Clar";
        } else {
          btn.textContent = "🌙 Mode Fosc";
        }
      }
    </script>
  </body>
</html>
